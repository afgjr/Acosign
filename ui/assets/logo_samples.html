<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700&family=Space+Grotesk:wght@700&family=Outfit:wght@700&display=swap" rel="stylesheet">
<style>
body{background:#0b0b0c;color:#f5f5f4;font-family:system-ui;margin:0;padding:24px;}
h2{font-weight:600;color:#8a8a8f;font-size:14px;letter-spacing:.08em;text-transform:uppercase;margin:32px 0 12px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{background:#1a1a1c;border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:18px}
.lockup{display:flex;align-items:center;gap:14px}
.lockup svg{width:52px;height:52px}
.word{font-size:34px;letter-spacing:-.02em}
.tag{color:#8a8a8f;font-size:13px}
.tab{display:flex;align-items:center;gap:8px;background:#26262a;border-radius:10px 10px 0 0;padding:8px 14px;width:max-content;font-size:13px}
.tab svg{width:16px;height:16px}
.small{display:flex;gap:10px;align-items:end}
</style></head><body>
<h2>Option A — Pulse (waveform bars)</h2>
<div class="row"><div class="card"><div class="lockup"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#0b0b0c"/><g transform="translate(0.0,0)"><rect x="0" y="22.0" width="8" height="20" rx="4.0" fill="#f5f26b"/><rect x="14" y="14.0" width="8" height="36" rx="4.0" fill="#f5f26b"/><rect x="28" y="4.0" width="8" height="56" rx="4.0" fill="#f5f26b"/><rect x="42" y="14.0" width="8" height="36" rx="4.0" fill="#f5f26b"/><rect x="56" y="22.0" width="8" height="20" rx="4.0" fill="#f5f26b"/></g></svg><span class="word" style="font-family:Sora">Acosign</span></div><span class="tag">Font: Sora</span>
<div class="tab"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#0b0b0c"/><g transform="translate(0.0,0)"><rect x="0" y="22.0" width="8" height="20" rx="4.0" fill="#f5f26b"/><rect x="14" y="14.0" width="8" height="36" rx="4.0" fill="#f5f26b"/><rect x="28" y="4.0" width="8" height="56" rx="4.0" fill="#f5f26b"/><rect x="42" y="14.0" width="8" height="36" rx="4.0" fill="#f5f26b"/><rect x="56" y="22.0" width="8" height="20" rx="4.0" fill="#f5f26b"/></g></svg> Acosign</div><div class="small"><svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#0b0b0c"/><g transform="translate(0.0,0)"><rect x="0" y="22.0" width="8" height="20" rx="4.0" fill="#f5f26b"/><rect x="14" y="14.0" width="8" height="36" rx="4.0" fill="#f5f26b"/><rect x="28" y="4.0" width="8" height="56" rx="4.0" fill="#f5f26b"/><rect x="42" y="14.0" width="8" height="36" rx="4.0" fill="#f5f26b"/><rect x="56" y="22.0" width="8" height="20" rx="4.0" fill="#f5f26b"/></g></svg><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#0b0b0c"/><g transform="translate(0.0,0)"><rect x="0" y="22.0" width="8" height="20" rx="4.0" fill="#f5f26b"/><rect x="14" y="14.0" width="8" height="36" rx="4.0" fill="#f5f26b"/><rect x="28" y="4.0" width="8" height="56" rx="4.0" fill="#f5f26b"/><rect x="42" y="14.0" width="8" height="36" rx="4.0" fill="#f5f26b"/><rect x="56" y="22.0" width="8" height="20" rx="4.0" fill="#f5f26b"/></g></svg></div></div></div>
<h2>Option B — Signal (fingerprint rings)</h2>
<div class="row"><div class="card"><div class="lockup"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#0b0b0c"/>
<g fill="none" stroke="#f5f26b" stroke-width="4" stroke-linecap="round">
<path d="M16 38 A16 16 0 0 1 48 38"/><path d="M23 40 A9 9 0 0 1 41 40"/><circle cx="32" cy="42" r="2.5" fill="#f5f26b" stroke="none"/></g>
<path d="M12 28 A22 22 0 0 1 52 28" fill="none" stroke="#f5f26b" stroke-width="4" stroke-linecap="round" opacity=".45"/></svg><span class="word" style="font-family:'Space Grotesk'">Acosign</span></div><span class="tag">Font: Space Grotesk</span>

<path d="M12 28 A22 22 0 0 1 52 28" fill="none" stroke="#f5f26b" stroke-width="4" stroke-linecap="round" opacity=".45"/></svg> Acosign</div><div class="small"><svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#0b0b0c"/>
<g fill="none" stroke="#f5f26b" stroke-width="4" stroke-linecap="round">
<path d="M16 38 A16 16 0 0 1 48 38"/><path d="M23 40 A9 9 0 0 1 41 40"/><circle cx="32" cy="42" r="2.5" fill="#f5f26b" stroke="none"/></g>
<path d="M12 28 A22 22 0 0 1 52 28" fill="none" stroke="#f5f26b" stroke-width="4" stroke-linecap="round" opacity=".45"/></svg><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#0b0b0c"/>
<g fill="none" stroke="#f5f26b" stroke-width="4" stroke-linecap="round">
<path d="M16 38 A16 16 0 0 1 48 38"/><path d="M23 40 A9 9 0 0 1 41 40"/><circle cx="32" cy="42" r="2.5" fill="#f5f26b" stroke="none"/></g>
<path d="M12 28 A22 22 0 0 1 52 28" fill="none" stroke="#f5f26b" stroke-width="4" stroke-linecap="round" opacity=".45"/></svg></div></div></div>
<h2>Option C — A-Wave (yellow tile, letter A from bars)</h2>
<div class="row"><div class="card"><div class="lockup"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#f5f26b"/>
<g fill="#0b0b0c"><rect x="14" y="30" width="7" height="22" rx="3.5"/><rect x="23" y="20" width="7" height="32" rx="3.5"/>
<rect x="34" y="12" width="7" height="40" rx="3.5"/><rect x="43" y="24" width="7" height="28" rx="3.5"/></g></svg><span class="word" style="font-family:Outfit">Acosign</span></div><span class="tag">Font: Outfit</span>

<rect x="34" y="12" width="7" height="40" rx="3.5"/><rect x="43" y="24" width="7" height="28" rx="3.5"/></g></svg> Acosign</div><div class="small"><svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#f5f26b"/>
<g fill="#0b0b0c"><rect x="14" y="30" width="7" height="22" rx="3.5"/><rect x="23" y="20" width="7" height="32" rx="3.5"/>
<rect x="34" y="12" width="7" height="40" rx="3.5"/><rect x="43" y="24" width="7" height="28" rx="3.5"/></g></svg><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#f5f26b"/>
<g fill="#0b0b0c"><rect x="14" y="30" width="7" height="22" rx="3.5"/><rect x="23" y="20" width="7" height="32" rx="3.5"/>
<rect x="34" y="12" width="7" height="40" rx="3.5"/><rect x="43" y="24" width="7" height="28" rx="3.5"/></g></svg></div></div></div>
</body></html>
